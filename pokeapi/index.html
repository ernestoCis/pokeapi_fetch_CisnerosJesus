<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <h1>Pokedex Apps Web</h1>

    <div id="buscador-container">
        <input type="text" name="buscador" placeholder="Busca un pokemon por su nombre o número">
        <button type="button" id="search-btn">Buscar</button>
    </div>
    <div id="pokemon-container">
        <h2>Nombre del pokemon</h2>

        <img src="https://placehold.co/600x400" alt="Pokemon Image">

        <p id="pokemon-data"></p>
    </div>
</body>
<script src="./pokedex.js"></script>
</html>
